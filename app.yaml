name: zigma-neural-intelligence
services:
  - name: web
    github:
      repo: gudlavarunkumar5195-bot/ZigmaNeuralIntelligence
      branch: main
      # Auto-deploy is off until CI (.github/workflows/ci.yml) is required on
      # main: App Platform cannot wait for a GitHub check, so deploy_on_push
      # would ship commits CI has not passed. Deploy manually after CI is green.
      deploy_on_push: false
    build_command: pnpm install --frozen-lockfile && pnpm --dir server install --frozen-lockfile && pnpm build
    # Migrations are NOT run here: they run once per release in the PRE_DEPLOY
    # job below, so scaling or restarting web instances never re-runs DDL.
    run_command: pnpm --dir server start
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /ready
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 5
    envs:
      # ── Frontend build config: embedded into the Vite artifact ────────────
      # The API is served by this same Fastify process in production.
      - key: VITE_APP_MODE
        scope: BUILD_TIME
        value: "production"
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: "/api/v1"
      # ── Runtime: set these in the DigitalOcean dashboard ──────────────────
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: COOKIE_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: QA_VERIFICATION_BYPASS_ENABLED
        scope: RUN_TIME
        value: "false"
      - key: QA_AUTHORIZED_EMAILS
        scope: RUN_TIME
        value: ""
      - key: PLATFORM_ADMIN_USER_IDS
        scope: RUN_TIME
        value: ""
      - key: QA_ALLOW_PRODUCTION_BYPASS
        scope: RUN_TIME
        value: "false"
      # ── Optional AI features ───────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      # ── Non-secret runtime config ─────────────────────────────────────────
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      # Certificate verification is mandatory in production. Supply DB_SSL_CA
      # through secure runtime configuration when the managed CA is not trusted.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "true"
      # App Platform terminates TLS at one managed ingress/load balancer that
      # appends the client address to X-Forwarded-For, so exactly 1 hop is
      # trusted. Without this every client shares the proxy IP and rate limits
      # become global. Raise only if another proxy/CDN is placed in front;
      # never set to "true" (rejected at startup). VERIFY after deploy that
      # request.ip differs per client (log request.ips once); if an extra CDN hop
      # appears in X-Forwarded-For, increase this to 2.
      - key: TRUST_PROXY
        scope: RUN_TIME
        value: "1"
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: "${APP_URL}"

# One-off release job: applies pending migrations once per deployment, before
# the new web instances start. Uses the direct (non-pooled) Neon endpoint when
# DIRECT_DATABASE_URL is set; DDL should not go through a transaction pooler.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: gudlavarunkumar5195-bot/ZigmaNeuralIntelligence
      branch: main
      deploy_on_push: false
    build_command: pnpm install --frozen-lockfile && pnpm --dir server install --frozen-lockfile && pnpm --dir server build
    run_command: pnpm --dir server migrate:prod
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DIRECT_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "true"
