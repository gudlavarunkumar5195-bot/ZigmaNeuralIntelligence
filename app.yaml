name: zigma-neural-intelligence

# App-level alerts (emailed to the team's DigitalOcean account owners/members;
# add Slack in the dashboard under App -> Settings -> Alert Policies).
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Log forwarding (optional): App Platform can ship runtime logs to Papertrail,
# Datadog, Logtail/Better Stack or OpenSearch via `log_destinations`. Only add
# one once you have an endpoint/token, e.g.:
#   log_destinations:
#     - name: logtail
#       logtail:
#         token: <set in the dashboard; never commit tokens>
# See docs/production-readiness/OBSERVABILITY-SENTRY.md.

services:
  - name: web
    github:
      repo: gudlavarunkumar5195-bot/ZigmaNeuralIntelligence
      branch: main
      # Auto-deploy is off until CI (.github/workflows/ci.yml) is required on
      # main: App Platform cannot wait for a GitHub check, so deploy_on_push
      # would ship commits CI has not passed. Deploy manually after CI is green.
      deploy_on_push: false
    build_command: pnpm install --frozen-lockfile && pnpm --dir server install --frozen-lockfile && pnpm build
    # Migrations are NOT run here: they run once per release in the PRE_DEPLOY
    # job below, so scaling or restarting web instances never re-runs DDL.
    run_command: pnpm --dir server start
    instance_count: 1
    # basic-xxs is a legacy 512 MiB slug. Recommended: apps-s-1vcpu-1gb (1 GiB,
    # ~$12/mo vs ~$5/mo) once Sentry + the AI router are live; see
    # docs/production-readiness/OBSERVABILITY-SENTRY.md before changing.
    instance_size_slug: basic-xxs
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: THIRTY_MINUTES
    health_check:
      http_path: /ready
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 5
    envs:
      # ── Frontend build config: embedded into the Vite artifact ────────────
      # The API is served by this same Fastify process in production.
      - key: VITE_APP_MODE
        scope: BUILD_TIME
        value: "production"
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: "/api/v1"
      # Browser Sentry (project "zigma-web"). A browser DSN is PUBLIC by design
      # (it ships in the JS bundle), so GENERAL is fine; it can only submit
      # events. Leave empty to disable. Never put the server DSN or any auth
      # token in a VITE_* variable.
      - key: VITE_SENTRY_DSN
        scope: BUILD_TIME
        type: GENERAL
        value: ""
      - key: VITE_SENTRY_ENVIRONMENT
        scope: BUILD_TIME
        value: "production"
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        scope: BUILD_TIME
        value: "0.05"
      # ── Runtime: set these in the DigitalOcean dashboard ──────────────────
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # Direct (non-pooled) Neon endpoint; used only for migrations/DDL.
      - key: DIRECT_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: COOKIE_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: QA_VERIFICATION_BYPASS_ENABLED
        scope: RUN_TIME
        value: "false"
      - key: QA_AUTHORIZED_EMAILS
        scope: RUN_TIME
        value: ""
      - key: PLATFORM_ADMIN_USER_IDS
        scope: RUN_TIME
        value: ""
      - key: QA_ALLOW_PRODUCTION_BYPASS
        scope: RUN_TIME
        value: "false"
      # ── Optional AI features ───────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Free models only. The router never selects a paid or unknown-price
      # model while this is false; budgets, quotas and trial limits are set
      # in the app (Admin → Model Intelligence → Settings), not here.
      - key: AI_ALLOW_PAID_MODELS
        scope: RUN_TIME
        value: "false"
      # The deterministic router chooses models; an extra LLM routing call
      # would spend the free daily allowance.
      - key: AI_ROUTER_LLM_ENABLED
        scope: RUN_TIME
        value: "false"
      # ── Optional Google Search Console (see docs/SEARCH_CONSOLE.md) ────────
      # All four or none; production refuses a partial setup.
      - key: GOOGLE_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_OAUTH_REDIRECT_URI
        scope: RUN_TIME
        value: "${APP_URL}/api/v1/integrations/google/oauth/callback"
      - key: INTEGRATION_ENCRYPTION_KEYS
        scope: RUN_TIME
        type: SECRET
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: "${APP_URL}"
      # ── Optional ClickHouse Cloud analytics (events stay in the PostgreSQL
      # outbox until HOST + PASSWORD + DATABASE are all set). HOST is a bare
      # hostname such as abc123.us-east-1.aws.clickhouse.cloud (no scheme).
      - key: CLICKHOUSE_HOST
        scope: RUN_TIME
        type: SECRET
      - key: CLICKHOUSE_PORT
        scope: RUN_TIME
        value: "8443"
      - key: CLICKHOUSE_DATABASE
        scope: RUN_TIME
        type: SECRET
      - key: CLICKHOUSE_USER
        scope: RUN_TIME
        type: SECRET
      - key: CLICKHOUSE_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # ── Error monitoring: Sentry (project "zigma-api") ────────────────────
      # No-op while SENTRY_DSN is unset.
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: "production"
      - key: SENTRY_TRACES_SAMPLE_RATE
        scope: RUN_TIME
        value: "0.1"
      - key: SENTRY_ENABLE_LOGS
        scope: RUN_TIME
        value: "true"
      # Release = zigma-api@<git sha> (DigitalOcean component bindable variable).
      - key: COMMIT_SHA
        scope: RUN_TIME
        value: "${_self.COMMIT_HASH}"
      # ── Non-secret runtime config ─────────────────────────────────────────
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      # Certificate verification is mandatory in production. Supply DB_SSL_CA
      # through secure runtime configuration when the managed CA is not trusted.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "true"
      # App Platform terminates TLS at one managed ingress/load balancer that
      # appends the client address to X-Forwarded-For, so exactly 1 hop is
      # trusted. Without this every client shares the proxy IP and rate limits
      # become global. Raise only if another proxy/CDN is placed in front;
      # never set to "true" (rejected at startup). VERIFY after deploy that
      # request.ip differs per client (log request.ips once); if an extra CDN hop
      # appears in X-Forwarded-For, increase this to 2.
      - key: TRUST_PROXY
        scope: RUN_TIME
        value: "1"
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: "${APP_URL}"

# One-off release job: applies pending migrations once per deployment, before
# the new web instances start. Uses the direct (non-pooled) Neon endpoint when
# DIRECT_DATABASE_URL is set; DDL should not go through a transaction pooler.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: gudlavarunkumar5195-bot/ZigmaNeuralIntelligence
      branch: main
      deploy_on_push: false
    build_command: pnpm install --frozen-lockfile && pnpm --dir server install --frozen-lockfile && pnpm --dir server build
    run_command: pnpm --dir server migrate:prod
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DIRECT_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "true"
