name: zigma-neural-intelligence
services:
  - name: web
    github:
      repo: gudlavarunkumar5195-bot/ZigmaNeuralIntelligence
      branch: main
      deploy_on_push: true
    build_command: pnpm build
    run_command: pnpm --dir server start
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 5
    envs:
      # ── Frontend build config: embedded into the Vite artifact ────────────
      # The API is served by this same Fastify process in production.
      - key: VITE_APP_MODE
        scope: BUILD_TIME
        value: "production"
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: "/api/v1"
      # ── Runtime: set these in the DigitalOcean dashboard ──────────────────
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_ANON_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: COOKIE_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: QA_VERIFICATION_BYPASS_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: QA_AUTHORIZED_EMAILS
        scope: RUN_TIME
        value: "zigma.qa.20260903@example.com"
      - key: QA_ALLOW_PRODUCTION_BYPASS
        scope: RUN_TIME
        value: "true"
      # ── Optional AI features ───────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      # ── Non-secret runtime config ─────────────────────────────────────────
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      # The managed database endpoint currently presents a private CA chain.
      # Set this to true when DB_SSL_CA is supplied for certificate validation.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "false"
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: "${APP_URL}"
      - key: JWT_ACCESS_EXPIRES_IN
        scope: RUN_TIME
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        scope: RUN_TIME
        value: "7d"
